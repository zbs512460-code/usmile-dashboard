<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>冲牙器周看板</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="冲牙器看板">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --font-anthropic-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-anthropic-serif: "Songti SC", "Noto Serif SC", Georgia, "Times New Roman", serif;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 16px; --cds-gap-xl: 28px;
    --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px; --cds-radius: 8px;
    --cds-font-size-title: 28px; --cds-font-size-heading: 16px; --cds-font-size-body: 14px; --cds-font-size-caption: 12px;
    --cds-font-weight-medium: 600; --cds-dur-slow: 240ms;
    --bg: #f6f6f4; --color-fg: #1d1d1b; --color-fg-muted: #6b6b66; --color-panel: #ffffff; --color-border-line: #e3e3de;
    --color-ok: #23804a; --color-bad: #c0392b; --color-warn: #b7791f;
    --cds-chart-grid: #ececea; --cds-chart-muted: #b9b9b3; --cds-chart-reference: #8f8f89;
    --cds-border: #e3e3de; --cds-text-secondary: #6b6b66; --cds-surface-popover: #ffffff; --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.12);
    --accent: #1f3b73;
    --wf-sticky-offset: 41px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --color-fg: #ececea; --color-fg-muted: #a3a39d; --color-panel: #1f2227; --color-border-line: #33363c;
      --color-ok: #4cc27f; --color-bad: #ef6b5b; --color-warn: #e0a640;
      --cds-chart-grid: #2b2e33; --cds-chart-muted: #5a5d63; --cds-chart-reference: #8a8d93;
      --cds-border: #33363c; --cds-text-secondary: #a3a39d; --cds-surface-popover: #262a30; --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.5);
      --accent: #8fb4ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --color-fg: #ececea; --color-fg-muted: #a3a39d; --color-panel: #1f2227; --color-border-line: #33363c;
    --color-ok: #4cc27f; --color-bad: #ef6b5b; --color-warn: #e0a640;
    --cds-chart-grid: #2b2e33; --cds-chart-muted: #5a5d63; --cds-chart-reference: #8a8d93;
    --cds-border: #33363c; --cds-text-secondary: #a3a39d; --cds-surface-popover: #262a30; --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.5);
    --accent: #8fb4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); -webkit-text-size-adjust: 100%; }
  #bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; justify-content: space-between;
         padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
         background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
         border-bottom: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  #bar button { font: inherit; color: var(--color-fg-muted); background: none; border: 1px solid var(--color-border-line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  #app { padding: 20px max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); max-width: 1280px; margin: 0 auto; }
  #lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
  #lock form { width: min(100%, 22rem); min-width: 0; grid-template-columns: minmax(0, 1fr); display: grid; gap: 12px; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 12px; padding: 24px; }
  #lock img { width: 56px; height: 56px; border-radius: 12px; }
  #lock h1 { font-size: 20px; margin: 0; font-weight: 600; }
  #lock p { margin: 0; color: var(--color-fg-muted); font-size: 13px; line-height: 1.5; }
  #lock input[type=password] { width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--color-border-line); background: var(--bg); color: var(--color-fg); }
  #lock label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--color-fg-muted); }
  #lock button { font: inherit; font-size: 16px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
  #lock button:disabled { opacity: .6; }
  #err { color: var(--color-bad); min-height: 1em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="lock">
  <form id="f" autocomplete="on">
    <img src="icon-192.png" alt="">
    <h1>美国站冲牙器周看板</h1>
    <p>内容已加密，输入访问密码后在本机解密查看。</p>
    <input type="text" name="username" value="usmile-dashboard" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="访问密码" required>
    <label><input id="remember" type="checkbox" checked> 在这台设备上记住</label>
    <button id="go" type="submit">打开</button>
    <p id="err" role="alert"></p>
  </form>
</div>
<div id="bar" hidden><span id="asof"></span><button id="logout" type="button">锁定</button></div>
<div id="app" hidden></div>
<script src="d3.min.js"></script>
<script>
(() => {
  const KEY = 'usd-key-v1';
  const ITER = 250000;
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

  async function fetchEnc() {
    const r = await fetch('app.enc', { cache: 'no-cache' });
    if (!r.ok) throw new Error('数据文件加载失败（' + r.status + '）');
    return new Uint8Array(await r.arrayBuffer());
  }
  async function deriveRaw(pw) {
    const salt = unb64((await (await fetch('salt.txt', { cache: 'no-cache' })).text()).trim());
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER }, base, 256);
  }
  async function decrypt(raw, enc) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: enc.slice(0, 12) }, key, enc.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function boot(p) {
    const loaders = {}, calcs = {}, cbs = [], data = {};
    window.dash = {
      // 数据可视化参考色板的前四个分类色（已通过色盲区分度校验），深色模式用同色相的深色档。
      colors: matchMedia('(prefers-color-scheme: dark)').matches ? ['#3987e5', '#d95926', '#199e70', '#c98500'] : ['#2a78d6', '#eb6834', '#1baf7a', '#eda100'],
      loader(id, o) { loaders[id] = o; },
      calc(id, o) { calcs[id] = o; },
      onData(cb) { cbs.push(cb); },
      data(id) { return data[id] ?? { status: 'missing' }; },
      setLink(id) { try { history.replaceState(null, '', '#' + id); } catch {} },
    };
    const app = document.getElementById('app');
    app.innerHTML = p.page;
    for (const old of app.querySelectorAll('script')) {
      const s = document.createElement('script');
      // 和看板一致：每个 <script> 各自一个作用域，同名工具函数互不冲突
      s.textContent = '(() => {\n' + old.textContent + '\n})();';
      old.replaceWith(s);
    }
    for (const [id, answer] of Object.entries(p.answers)) {
      try { data[id] = { status: 'ok', data: loaders[id] ? loaders[id].fn({ answer }) : JSON.parse(answer) }; }
      catch (e) { console.error(id, e); data[id] = { status: 'error' }; }
    }
    for (const [id, rows] of Object.entries(p.files)) data[id] = { status: 'ok', data: rows };
    for (const id of Object.keys(loaders)) if (!data[id]) data[id] = { status: 'missing' };
    let progress = true;
    while (progress) {
      progress = false;
      for (const [id, c] of Object.entries(calcs)) {
        if (data[id]) continue;
        const st = c.inputs.map((i) => data[i]?.status);
        if (st.every((s) => s === 'ok')) {
          try { data[id] = { status: 'ok', data: c.fn(...c.inputs.map((i) => data[i].data)) }; }
          catch (e) { console.error(id, e); data[id] = { status: 'error' }; }
          progress = true;
        } else if (st.some((s) => s && s !== 'ok')) { data[id] = { status: 'error' }; progress = true; }
      }
    }
    document.getElementById('asof').textContent = `数据截至 ${p.data_date} · 每周一更新 · 卖家精灵估算`;
    document.getElementById('lock').hidden = true;
    document.getElementById('bar').hidden = false;
    app.hidden = false;
    cbs.forEach((cb) => cb());
  }

  const form = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  async function tryStored() {
    const k = store.get(KEY);
    if (!k) return false;
    try { boot(await decrypt(unb64(k), await fetchEnc())); return true; }
    catch (e) { console.warn(e); store.del(KEY); return false; }
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = '解密中…';
    try {
      const enc = await fetchEnc();
      const raw = await deriveRaw(document.getElementById('pw').value);
      let p;
      try { p = await decrypt(raw, enc); } catch { throw new Error('密码不对'); }
      if (document.getElementById('remember').checked) store.set(KEY, b64(raw));
      boot(p);
    } catch (e2) {
      err.textContent = e2.message || String(e2);
    } finally { go.disabled = false; go.textContent = '打开'; }
  });
  document.getElementById('logout').addEventListener('click', () => { store.del(KEY); location.replace(location.pathname); });
  tryStored();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
